<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC 제어 프로그램 분석 Tool</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f8;font-family:system-ui,sans-serif}
#status{position:fixed;inset:0;display:grid;place-items:center;color:#334155;font-size:16px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div id="status" role="status">Tool 불러오는 중…</div>
<iframe id="app" title="PC 제어 프로그램 분석 Tool" hidden></iframe>
<script>
(async()=>{
 const status=document.getElementById("status");
 const frame=document.getElementById("app");
 try{
  const files=[
   "./source-part1.txt?v=94c0fcd2ee6744112a94b98aabedc2a120f4f303",
   "./source-part2.txt?v=c041fa66d41905060ea88eacb9c8b92b311b034f"
  ];
  const parts=await Promise.all(files.map(async url=>{
   const response=await fetch(url,{cache:"no-store"});
   if(!response.ok) throw new Error("Source load failed: "+response.status);
   return response.text();
  }));
  let source=parts.join("");
  source=source.replace(/<a class="main-manual-link"[^>]*>[^<]*<\/a>/,"");
  const navGuideScript='<script>(()=>{const main=document.querySelector("aside nav .nav-main");if(!main)return;const link=document.createElement("a");link.className="manual-nav-link";link.href="./manual.html";link.target="_blank";link.rel="noopener";link.textContent="사용 설명서 보기 ↗";link.style.cssText="display:block;box-sizing:border-box;width:100%;margin:0 0 8px;padding:8px 9px;border:1px solid #c7d9e7;border-radius:5px;background:#edf4f9;color:#20508b;font-size:12px;font-weight:700;line-height:1.6;text-decoration:none";const heading=main.querySelector(".group-title");if(heading)heading.after(link);else main.prepend(link)})();<\/script>';
  if(!source.includes("</body>")) throw new Error("Tool page end not found");
  source=source.replace("</body>",navGuideScript+"</body>");
  frame.srcdoc=source;
  frame.hidden=false;
  status.remove();
 }catch(error){
  status.textContent="Tool을 불러오지 못했습니다. 페이지를 새로고침해 주세요.";
  console.error(error);
 }
})();
</script>
</body>
</html>
