<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC 제어 프로그램 분석 Tool</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f8;font-family:system-ui,sans-serif}
#status{position:fixed;inset:0;display:grid;place-items:center;color:#334155;font-size:16px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div id="status" role="status">Tool 불러오는 중…</div>
<iframe id="app" title="PC 제어 프로그램 분석 Tool" hidden></iframe>
<script>
(async()=>{
 const status=document.getElementById("status");
 const frame=document.getElementById("app");
 try{
  const files=[
   "./source-part1.txt?v=94c0fcd2ee6744112a94b98aabedc2a120f4f303",
   "./source-part2.txt?v=c041fa66d41905060ea88eacb9c8b92b311b034f"
  ];
  const parts=await Promise.all(files.map(async url=>{
   const response=await fetch(url,{cache:"no-store"});
   if(!response.ok) throw new Error("Source load failed: "+response.status);
   return response.text();
  }));
  let source=parts.join("");
  const mainPoint="</p></div><button id=\"atlasWide\">";
  const guideLink='<a class="main-manual-link" href="./manual.html" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;margin-top:10px;padding:8px 13px;border:1px solid #285f8d;border-radius:5px;background:#285f8d;color:#fff;font-size:13px;font-weight:700;text-decoration:none">처음 사용하시나요? 사용 설명서 보기 →</a>';
  if(!source.includes(mainPoint)) throw new Error("Main screen placement not found");
  source=source.replace(mainPoint,'</p>'+guideLink+'</div><button id="atlasWide">');
  frame.srcdoc=source;
  frame.hidden=false;
  status.remove();
 }catch(error){
  status.textContent="Tool을 불러오지 못했습니다. 페이지를 새로고침해 주세요.";
  console.error(error);
 }
})();
</script>
</body>
</html>
